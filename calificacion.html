<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartOrderFood - Califica tu Experiencia</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --primary-orange: #FF521B;
            --primary-gradient: linear-gradient(135deg, #FF521B 0%, #FF7A00 100%);
            --bg-soft-cream: #FAFAFA;
            --card-border-radius: 28px;
            --text-dark: #1A1A1A;
            --text-muted: #737373;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-soft-cream);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Navbar personalizado */
        .navbar-custom {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .nav-link {
            font-weight: 600;
            color: var(--text-dark) !important;
            padding: 0.5rem 0.8rem !important;
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary-orange) !important;
            background: rgba(255, 82, 27, 0.08);
        }

        /* Tarjeta UI */
        .auth-card {
            background: #FFFFFF;
            border-radius: var(--card-border-radius);
            border: 1px solid rgba(0, 0, 0, 0.04);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
        }

        /* Campos de entrada modernos */
        .form-control-custom {
            background-color: #F8F9FA;
            border: 1px solid #E5E7EB;
            border-radius: 16px;
            padding: 0.85rem 1.15rem;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .form-control-custom:focus {
            background-color: #FFFFFF;
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 4px rgba(255, 82, 27, 0.12);
        }

        /* Botón Principal */
        .btn-primary-orange {
            background: var(--primary-gradient);
            color: #ffffff;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            padding: 0.9rem 1.5rem;
            box-shadow: 0 10px 25px rgba(255, 82, 27, 0.25);
            transition: all 0.25s ease;
        }

        .btn-primary-orange:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(255, 82, 27, 0.35);
            color: #ffffff;
        }

        .icon-box-auth {
            width: 75px;
            height: 75px;
            background: rgba(255, 82, 27, 0.08);
            color: var(--primary-orange);
            border-radius: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>

<body>

<script src="js.js"></script>
<script>protegerPagina();</script>

<!-- NAVBAR NAVEGACIÓN COMPLETA -->
<nav class="navbar navbar-expand-lg navbar-custom sticky-top py-3">
    <div class="container">
        <a class="navbar-brand fw-extrabold fs-4 text-dark d-flex align-items-center gap-2" href="index.html">
            <div class="bg-warning text-dark rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 40px; height: 40px;">
                <i class="bi bi-shop fs-5"></i>
            </div>
            <span style="letter-spacing: -0.5px;">SmartOrder<span style="color: var(--primary-orange);">Food</span></span>
        </a>

        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-1 mt-3 mt-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="index.html"><i class="bi bi-house-door-fill me-1"></i> Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="menu.html"><i class="bi bi-grid-fill me-1"></i> Menú</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="calificacion.html"><i class="bi bi-star-fill me-1"></i> Calificar</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="perfil.html"><i class="bi bi-person-fill me-1"></i> Perfil</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- SECCIÓN DE CALIFICACIÓN -->
<main class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="auth-card p-4 p-md-5">

                <div class="text-center mb-4">
                    <div class="icon-box-auth shadow-sm">
                        <i class="bi bi-star-fill"></i>
                    </div>
                    <h2 class="fw-extrabold text-dark mb-1" style="letter-spacing: -0.5px;">
                        Califica tu Experiencia
                    </h2>
                    <p class="text-muted small">
                        Tu opinión nos ayuda a mejorar nuestros platillos y servicio diario.
                    </p>
                </div>

                <form id="formCalificacion" onsubmit="enviarCalificacion(event)">

                    <!-- RANGO / SATISFACCIÓN -->
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label fw-bold small text-muted m-0">Puntuación general (1 al 5)</label>
                            <span id="valorPuntuacion" class="badge bg-warning text-dark fw-bold">★ 3 / 5</span>
                        </div>
                        <input type="range" class="form-range" min="1" max="5" step="1" value="3" id="puntuacion"
                               oninput="document.getElementById('valorPuntuacion').textContent = '★ ' + this.value + ' / 5'" required>
                        <div class="d-flex justify-content-between text-muted small fw-bold">
                            <span>1 - Malo</span>
                            <span>3 - Regular</span>
                            <span>5 - Excelente</span>
                        </div>
                    </div>

                    <!-- CHECKBOXES DE ASPECTOS -->
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted">¿Qué fue lo que más te gustó?</label>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" value="El sabor de los alimentos" id="checkSabor">
                            <label class="form-check-label" for="checkSabor">El sabor de los alimentos</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" value="Rapidez en el servicio" id="checkTiempo">
                            <label class="form-check-label" for="checkTiempo">Rapidez en el servicio</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="Atención del personal" id="checkAtencion">
                            <label class="form-check-label" for="checkAtencion">Atención del personal</label>
                        </div>
                    </div>

                    <!-- TEXTAREA -->
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted">Comentarios o sugerencias de mejora</label>
                        <textarea id="comentariosCalificacion" class="form-control form-control-custom" rows="4" placeholder="Escribe tus comentarios aquí..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary-orange w-100 text-white shadow-sm py-3">
                        Enviar Calificación <i class="bi bi-send-fill ms-1"></i>
                    </button>

                    <div id="mensajeCalificacion"></div>
                </form>

            </div>

        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="bg-white border-top py-4 mt-auto text-center">
    <div class="container">
        <p class="text-muted small m-0">SmartOrderFood &copy; 2026. Todos los derechos reservados.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
