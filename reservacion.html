<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartOrderFood - Reservación</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --primary-orange: #FF521B;
            --primary-gradient: linear-gradient(135deg, #FF521B 0%, #FF7A00 100%);
            --bg-soft-cream: #FAFAFA;
            --card-border-radius: 28px;
            --text-dark: #1A1A1A;
            --text-muted: #737373;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-soft-cream);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .navbar-custom {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .nav-link {
            font-weight: 600;
            color: var(--text-dark) !important;
            padding: 0.5rem 0.8rem !important;
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary-orange) !important;
            background: rgba(255, 82, 27, 0.08);
        }

        .auth-card {
            background: #FFFFFF;
            border-radius: var(--card-border-radius);
            border: 1px solid rgba(0, 0, 0, 0.04);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
        }

        .form-control-custom {
            background-color: #F8F9FA;
            border: 1px solid #E5E7EB;
            border-radius: 16px;
            padding: 0.85rem 1.15rem;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .form-control-custom:focus {
            background-color: #FFFFFF;
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 4px rgba(255, 82, 27, 0.12);
        }

        .btn-primary-orange {
            background: var(--primary-gradient);
            color: #ffffff;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            padding: 0.9rem 1.5rem;
            box-shadow: 0 10px 25px rgba(255, 82, 27, 0.25);
            transition: all 0.25s ease;
        }

        .btn-primary-orange:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(255, 82, 27, 0.35);
            color: #ffffff;
        }

        .icon-box-auth {
            width: 75px;
            height: 75px;
            background: rgba(255, 82, 27, 0.08);
            color: var(--primary-orange);
            border-radius: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>

<body>

<script src="js.js"></script>
<script>
    protegerPagina();
</script>

<nav class="navbar navbar-expand-lg navbar-custom sticky-top py-3">
    <div class="container">
        <a class="navbar-brand fw-extrabold fs-4 text-dark d-flex align-items-center gap-2" href="index.html">
            <div class="bg-warning text-dark rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 40px; height: 40px;">
                <i class="bi bi-shop fs-5"></i>
            </div>
            <span style="letter-spacing: -0.5px;">SmartOrder<span style="color: var(--primary-orange);">Food</span></span>
        </a>

        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-1 mt-3 mt-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="index.html"><i class="bi bi-house-door-fill me-1"></i> Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="menu.html"><i class="bi bi-grid-fill me-1"></i> Menú</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="reservacion.html"><i class="bi bi-calendar-check-fill me-1"></i> Reservar</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="perfil.html"><i class="bi bi-person-fill me-1"></i> Perfil</a>
                </li>
                <li class="nav-item ms-lg-2">
                    <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm rounded-pill px-3 fw-bold">
                        Cerrar sesión
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="auth-card p-4 p-md-5">

                <div class="text-center mb-4">
                    <div class="icon-box-auth shadow-sm">
                        <i class="bi bi-calendar-event-fill"></i>
                    </div>
                    <h2 class="fw-extrabold text-dark mb-1" style="letter-spacing: -0.5px;">
                        Reservar mesa
                    </h2>
                    <p class="text-muted small">
                        Completa los datos para realizar tu reservación.
                    </p>
                </div>

                <form onsubmit="confirmarReservacion(event)">

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Nombre completo</label>
                        <input
                                type="text"
                                id="nombreReserva"
                                class="form-control form-control-custom"
                                placeholder="Tu nombre"
                                required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Correo electrónico</label>
                        <input
                                type="email"
                                id="correoReserva"
                                class="form-control form-control-custom"
                                placeholder="ejemplo@correo.com"
                                required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold small text-muted">Fecha</label>
                            <input
                                    type="date"
                                    id="fechaReserva"
                                    class="form-control form-control-custom"
                                    required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold small text-muted">Hora</label>
                            <input
                                    type="time"
                                    id="horaReserva"
                                    class="form-control form-control-custom"
                                    required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Número de personas</label>
                        <input
                                type="number"
                                id="personasReserva"
                                class="form-control form-control-custom"
                                min="1"
                                max="20"
                                placeholder="Ej. 4"
                                required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted">Comentarios</label>
                        <textarea
                                id="comentariosReserva"
                                class="form-control form-control-custom"
                                rows="4"
                                placeholder="Alguna solicitud especial..."></textarea>
                    </div>

                    <div class="alert alert-warning border-0 shadow-sm rounded-4 mb-4 small">
                        <i class="bi bi-info-circle-fill me-1"></i> <strong>Importante:</strong> Tu reservación será enviada al restaurante para su confirmación.
                    </div>

                    <button
                            type="submit"
                            class="btn btn-primary-orange w-100 text-white shadow-sm py-3">
                        Confirmar reservación <i class="bi bi-arrow-right ms-1"></i>
                    </button>

                </form>

                <div id="mensajeReserva" class="mt-4"></div>

            </div>

        </div>
    </div>
</main>

<footer class="bg-white border-top py-4 mt-auto text-center">
    <div class="container">
        <p class="text-muted small m-0">SmartOrderFood &copy; 2026. Todos los derechos reservados.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
